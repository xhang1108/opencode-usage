name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed for the version-regression check below.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Generated files must match vendor.json (single source of truth).
      - name: Generated manifest/registry are up to date
        run: node tools/build-manifest.mjs --check

      # Unit tests include the guardrails: manifest key, migration planner,
      # store/clear invariants, and the backup round-trip.
      - name: Tests
        run: npm test

      # A release tag and the manifest version must never diverge, and the
      # manifest must never go backwards - the branch previously sat on an old
      # version through an entire breaking series, which broke the update banner.
      - name: Manifest version must not regress below the latest tag
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          MANIFEST=$(node -p "require('./extension/manifest.json').version")
          if [ -z "$LATEST" ]; then
            echo "no release tags yet; manifest=$MANIFEST"
            exit 0
          fi
          TAG="${LATEST#v}"
          node -e "const c=(a,b)=>{a=a.split('.').map(Number);b=b.split('.').map(Number);for(let i=0;i<3;i++){if(a[i]!==b[i])return a[i]-b[i]}return 0};const m=process.argv[1],t=process.argv[2];if(c(m,t)<0){console.error('manifest '+m+' < latest tag '+t);process.exit(1)}console.log('version ok: manifest '+m+' >= latest tag '+t)" "$MANIFEST" "$TAG"
