name: Price watch

# Long-term vendor price history: fetch each vendor's official price source,
# commit a snapshot only when prices changed, and rebuild the preset. Git
# history of vendors/*/price-snapshots/ is the dated price-change log.
on:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Accept a model-count drop as a real retirement (yes, the change must also be listed in tools/snapshot-shrink-allowlist.json or CI fails)"
        type: boolean
        default: false

# One run at a time, queued not cancelled: a manual dispatch cannot race the
# daily schedule against the same snapshot files.
concurrency:
  group: price-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # continue-on-error so a failing source still lets the healthy sources'
      # snapshots be rebuilt and committed; the final step re-fails the job.
      - name: Fetch price snapshots + rebuild presets
        id: watch
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          node tools/price-watch.mjs ${{ inputs.allow_shrink && '--allow-shrink' || '' }} 2>&1 | tee "$RUNNER_TEMP/price-watch.log" || status=$?
          {
            echo "### price-watch"
            echo '```'
            cat "$RUNNER_TEMP/price-watch.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # A rates change makes extension/shared/unified.preset.json stale; without
      # this rebuild the next push turns CI's preset-sync test red. npm test
      # guards the commit (fail-closed: never push a broken tree).
      - name: Rebuild unified preset + run tests
        run: |
          node tools/build-unified-preset.mjs
          npm test

      - name: Commit changes
        run: |
          git config user.name "price-watch"
          git config user.email "price-watch@users.noreply.github.com"
          git add extension/vendors/*/price-snapshots extension/vendors/*/rates.preset.json extension/vendors/*/rates.source.json extension/shared/unified.preset.json
          if git diff --cached --quiet; then
            echo "no price changes"
          else
            git commit -m "chore(price-watch): update vendor price snapshots"
            git push
          fi

      # Keep fail-closed: the job ends RED when any source failed, but the
      # healthy sources' data was already committed above.
      - name: Fail if a source failed
        if: steps.watch.outcome == 'failure'
        run: |
          echo "::error::one or more price sources failed (see the run summary); changes from the healthy sources were still committed"
          exit 1
