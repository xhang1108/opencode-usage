name: Model watch

# Daily model-catalog watch: fetch each vendor's public models endpoint
# (opencode Go, CommandCode Provider), diff against the committed snapshot, and
# commit ONLY the snapshot files when a set changed. Git history of
# vendors/<source>/models.snapshot.json is the dated model add/remove log. No
# pricing data is touched; the unified builder reads CommandCode's `name` field
# to fingerprint routing ids against their canonical model name.
#
# Both catalogs rotate for real, so their shrink policy is "warn": a drop is
# recorded and reported, never blocked. The run only fails when the fetch or the
# payload itself is broken.
on:
  schedule:
    - cron: "7 5 * * *" # daily 05:07 UTC (13:07 Taipei)
  workflow_dispatch:

# One run at a time, queued not cancelled: a manual dispatch cannot race the
# daily schedule against the same snapshot file.
concurrency:
  group: model-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests
        run: npm test

      - name: Diff model snapshots
        run: node tools/model-watch.mjs

      # Fixed paths only - never `git add -A`, so this can only ever commit the
      # watcher state files.
      - name: Commit changes
        run: |
          git config user.name "model-watch"
          git config user.email "model-watch@users.noreply.github.com"
          git add extension/vendors/*/models.snapshot.json
          if git diff --cached --quiet; then
            echo "no model changes"
          else
            git commit -m "chore(model-watch): update model snapshots"
            git push
          fi
