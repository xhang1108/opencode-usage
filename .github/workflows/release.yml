name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The update checker compares the release tag with the installed
      # manifest version, so they must match or users would see a perpetual
      # "update available" banner.
      - name: Verify manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./extension/manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag v$TAG does not match manifest version $MANIFEST" >&2
            exit 1
          fi

      # Zip the extension folder so manifest.json sits at the zip root -
      # users unzip and Load unpacked that folder directly.
      - name: Package extension
        run: |
          cd extension
          zip -r "../opencode-usage-${GITHUB_REF_NAME}.zip" . -x "*.DS_Store"

      # Release notes come from CHANGELOG.md (curated, includes upgrade steps),
      # not GitHub's auto-generated commit list - the breaking-change notes must
      # not be buried. Write the section for this tag into the release body.
      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" 'index($0,"## " ver)==1 {flag=1; next} flag && index($0,"## ")==1 {exit} flag {print}' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No CHANGELOG section for $TAG" >&2
            echo "Release $TAG. See CHANGELOG.md for details." > release-body.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: opencode-usage-${{ github.ref_name }}.zip
          body_path: release-body.md