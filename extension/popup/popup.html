<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../theme.css">
  <style>
    /* Transparent html background lets the rounded body corners show through */
    html { background: transparent; }
    html, body { overflow: hidden; }
    body {
      width: 300px;
      font-size: 13px;
      padding: 14px;
      border-radius: 12px;
      overflow: hidden;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .card { padding: 12px; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; margin: 4px 0; }
    .row .label { color: var(--text-muted); }
    .row .value { font-weight: 600; }
    .row .value.last-rec {
      font-size: 11px;
      font-weight: 500;
      max-width: 170px;
      text-align: right;
      word-break: break-all;
    }
    .btn { margin-bottom: 8px; }
    /* Split crawl button: main action + vendor picker */
    .split { display: flex; gap: 6px; margin-bottom: 8px; }
    .split .btn { margin-bottom: 0; }
    .split #btn-sync { flex: 1; }
    .split-caret { padding: 0 10px !important; }
    .split-menu { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .split-menu[hidden] { display: none; }
    .split-item {
      text-align: left; background: var(--bg-content); color: var(--text-secondary);
      border: 1px solid var(--border-muted); border-radius: var(--radius-sm);
      padding: 7px 10px; font-size: 12px; cursor: pointer;
    }
    .split-item:hover:not(:disabled) { color: var(--text); border-color: var(--border); }
    .split-item:disabled { opacity: 0.45; cursor: default; }
    #status { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
    /* B10: crawl finished but returned nothing */
    #status.warn { color: #d69b3c; }
    #status:empty { display: none; }
    #status.ok { color: var(--success); }
    #status.err { color: var(--danger); }

    /* Update banner */
    .update-banner {
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(106, 143, 192, 0.4);
      background: rgba(106, 143, 192, 0.1);
      border-radius: var(--radius-md);
    }
    .update-title { font-weight: 700; margin-bottom: 3px; }
    .update-detail { font-size: 12px; color: var(--text-muted); }
    .update-detail a { color: var(--primary); font-weight: 600; }

    /* Time reminder (shared base lives in theme.css) */
    .time-head { margin-bottom: 10px; gap: 8px; }
    .time-status { padding: 3px 8px; }
    .time-hero {
      justify-content: center;
      background: var(--bg-content);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-md);
      padding: 6px 12px;
      margin: 0 0 10px;
    }
    .time-countdown { font-size: 24px; letter-spacing: 1px; }
    .timeline { gap: 2px; height: 14px; margin-bottom: 10px; }
    .timeline .seg { border-radius: 2px; }
    .time-legend { gap: 12px; font-size: 10px; }
    .time-legend .dot { width: 8px; height: 8px; margin-right: 4px; }
    .time-empty { font-size: 11px; }

  </style>
</head>
<body>
  <h1>Opencode Token Usage</h1>

  <div class="update-banner" id="update-banner" style="display:none;">
    <div class="update-title">Update available</div>
    <div class="update-detail">v<span id="update-version">-</span> → <a id="update-link" href="#" target="_blank" rel="noopener">Download</a></div>
  </div>

  <div class="card">
    <div class="row" id="crawl-progress-row" style="display:none;">
      <span class="label">Sync Progress</span>
      <span class="value" id="crawl-progress" style="color:var(--primary);">-</span>
    </div>
    <div class="row"><span class="label">Last Sync</span><span class="value" id="last-sync">-</span></div>
    <div class="row"><span class="label">New Records</span><span class="value" id="last-sync-count">-</span></div>
    <div class="row"><span class="label">Last Record</span><span class="value last-rec" id="last-record">-</span></div>
    <div class="row"><span class="label">Total Records</span><span class="value" id="total-records">-</span></div>
    <div class="row"><span class="label">Usage</span><a class="value" id="usage-link" href="#" target="_blank" rel="noopener" style="font-size:11px; font-weight:600; color:var(--primary); display:none; text-decoration:none;"></a><span class="value" id="usage-link-empty" style="font-size:11px; color:var(--text-muted);">-</span></div>
  </div>

  <button class="btn btn-primary btn-block" id="btn-dashboard">Open Dashboard</button>
  <div class="split" id="crawl-split">
    <button class="btn btn-secondary" id="btn-sync">Crawl Now</button>
    <button class="btn btn-secondary split-caret" id="btn-sync-menu" title="Choose a vendor to crawl">▾</button>
  </div>
  <div class="split-menu" id="sync-menu" hidden></div>
  <!-- Rescan button - hidden by default. Uncomment to show:
  <button class="btn btn-danger btn-block" id="btn-rescan">Rescan (overwrite, keep data)</button>
  -->

  <div class="card time-card" id="time-card">
    <div class="time-head">
      <span class="time-status" id="time-status">—</span>
      <label class="switch" for="time-toggle">
        <input type="checkbox" id="time-toggle">
        <span class="track"></span>
        REMIND
      </label>
    </div>
    <div class="time-hero">
      <div class="time-countdown" id="time-countdown">--:--:--</div>
    </div>
    <div class="timeline" id="time-timeline"></div>
    <div class="time-legend">
      <span><span class="dot peak"></span>Peak</span>
      <span><span class="dot offpeak"></span>Off-peak</span>
    </div>
  </div>

  <div id="status"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
