<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../theme.css">
  <style>
    /* Transparent html background lets the rounded body corners show through */
    html { background: transparent; }
    body {
      width: 300px;
      font-size: 13px;
      padding: 14px;
      border-radius: 12px;
      overflow: hidden;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .card { padding: 12px; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; margin: 4px 0; }
    .row .label { color: var(--text-muted); }
    .row .value { font-weight: 600; }
    .row .value.last-rec {
      font-size: 11px;
      font-weight: 500;
      max-width: 170px;
      text-align: right;
      word-break: break-all;
    }
    .btn { margin-bottom: 8px; }
    #status { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
    #status:empty { display: none; }
    #status.ok { color: var(--success); }
    #status.err { color: var(--danger); }

    /* Update banner */
    .update-banner {
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(106, 143, 192, 0.4);
      background: rgba(106, 143, 192, 0.1);
      border-radius: var(--radius-md);
    }
    .update-title { font-weight: 700; margin-bottom: 3px; }
    .update-detail { font-size: 12px; color: var(--text-muted); }
    .update-detail a { color: var(--primary); font-weight: 600; }

    /* Time reminder */
    .time-card { padding: 12px; margin-bottom: 10px; }
    .time-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
    .time-status { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: var(--radius-sm); }
    .time-status.peak { background: rgba(176, 74, 74, 0.15); color: var(--peak); border: 1px solid rgba(176, 74, 74, 0.4); }
    .time-status.offpeak { background: rgba(106, 143, 192, 0.15); color: var(--primary); border: 1px solid rgba(106, 143, 192, 0.4); }
    .time-status.flat { background: rgba(161, 161, 166, 0.15); color: var(--text-muted); border: 1px solid var(--border); }
    .time-hero {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-content);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-md);
      padding: 6px 12px;
      margin: 0 0 10px;
    }
    .time-countdown {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .time-countdown.peak { color: var(--peak); }
    .time-countdown.offpeak { color: var(--primary); }
    .time-countdown.flat { color: var(--text-muted); }
    .timeline { display: flex; gap: 2px; height: 14px; margin-bottom: 10px; }
    .timeline .seg { flex: 1; border-radius: 2px; background: var(--border-muted); }
    .timeline .seg.peak { background: var(--peak); }
    .timeline .seg.now { outline: 2px solid var(--text); outline-offset: -1px; }
    .time-legend { display: flex; gap: 12px; font-size: 10px; color: var(--text-muted); }
    .time-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
    .time-legend .dot.peak { background: var(--peak); }
    .time-legend .dot.offpeak { background: var(--primary); }
    .time-empty { font-size: 11px; color: var(--text-muted); }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .switch .track {
      position: relative;
      width: 36px;
      height: 20px;
      background: var(--border);
      border-radius: var(--radius-sm);
      transition: background 0.2s ease;
      flex-shrink: 0;
    }
    .switch .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: var(--radius-sm);
      transition: transform 0.2s ease;
    }
    .switch input:checked + .track {
      background: var(--primary);
    }
    .switch input:checked + .track::after {
      transform: translateX(16px);
    }
    .switch input:focus-visible + .track {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <h1>Opencode Token Usage</h1>

  <div class="update-banner" id="update-banner" style="display:none;">
    <div class="update-title">Update available</div>
    <div class="update-detail">v<span id="update-version">-</span> → <a id="update-link" href="#" target="_blank" rel="noopener">Download</a></div>
  </div>

  <div class="card">
    <div class="row" id="crawl-progress-row" style="display:none;">
      <span class="label">Sync Progress</span>
      <span class="value" id="crawl-progress" style="color:var(--primary);">-</span>
    </div>
    <div class="row"><span class="label">Last Sync</span><span class="value" id="last-sync">-</span></div>
    <div class="row"><span class="label">New Records</span><span class="value" id="last-sync-count">-</span></div>
    <div class="row"><span class="label">Last Record</span><span class="value last-rec" id="last-record">-</span></div>
    <div class="row"><span class="label">Total Records</span><span class="value" id="total-records">-</span></div>
    <div class="row"><span class="label">Usage</span><a class="value" id="usage-link" href="#" target="_blank" rel="noopener" style="font-size:11px; font-weight:600; color:var(--primary); display:none; text-decoration:none;"></a><span class="value" id="usage-link-empty" style="font-size:11px; color:var(--text-muted);">-</span></div>
  </div>

  <button class="btn btn-primary btn-block" id="btn-dashboard">Open Dashboard</button>
  <button class="btn btn-secondary btn-block" id="btn-sync">Crawl Now</button>
  <!-- Rescan button - hidden by default. Uncomment to show:
  <button class="btn btn-danger btn-block" id="btn-rescan">Rescan (overwrite, keep data)</button>
  -->

  <div class="card time-card" id="time-card">
    <div class="time-head">
      <span class="time-status" id="time-status">—</span>
      <label class="switch" for="time-toggle">
        <input type="checkbox" id="time-toggle">
        <span class="track"></span>
        REMIND
      </label>
    </div>
    <div class="time-hero">
      <div class="time-countdown" id="time-countdown">--:--:--</div>
    </div>
    <div class="timeline" id="time-timeline"></div>
    <div class="time-legend">
      <span><span class="dot peak"></span>Peak</span>
      <span><span class="dot offpeak"></span>Off-peak</span>
    </div>
  </div>

  <div id="status"></div>

  <script src="../time-reminder.js"></script>
  <script src="popup.js"></script>
</body>
</html>
